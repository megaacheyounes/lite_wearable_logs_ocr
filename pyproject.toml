[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wearable-logs-ocr"
version = "0.2.0"
description = "Local OCR extraction of Huawei Lite Wearable logs displayed by DevEco Assistant"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
